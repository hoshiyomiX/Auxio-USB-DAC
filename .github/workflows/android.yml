name: Android Build

on:
  push:
    branches: []
  pull_request:
    branches: []

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Redirect git.ffmpeg.org to GitHub mirror
      run: git config --global url."https://github.com/FFmpeg/FFmpeg.git".insteadOf "https://git.ffmpeg.org/ffmpeg.git"
    - name: Clone submodules
      run: git submodule update --init --recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "jetbrains"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Fetch native codec sources (libFLAC + libopus)
      run: |
        chmod +x decent-media3-decoder-flac/setup.sh decent-usb-audio-driver/setup.sh
        ./decent-media3-decoder-flac/setup.sh
        ./decent-usb-audio-driver/setup.sh
    - name: Build debug APKs with Gradle
      # packageDebug produces one APK per ABI (arm64-v8a, armeabi-v7a, x86, x86_64)
      # plus a universal APK, because app/build.gradle defines `splits { abi {} }`.
      run: ./gradlew app:packageDebug
    - name: List built APKs
      run: |
        echo "=== Per-ABI APK outputs ==="
        ls -lh app/build/outputs/apk/debug/*.apk || true
    # Per-ABI artifacts: each APK is uploaded as a separate downloadable artifact
    # (not bundled into a single zip). Downloaders can pick the exact APK they need.
    # Artifact names follow the pattern: Auxio_Canary-<abi>
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary-arm64-v8a
        path: ./app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
        if-no-files-found: error
        retention-days: 30
    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary-armeabi-v7a
        path: ./app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
        if-no-files-found: error
        retention-days: 30
    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary-x86_64
        path: ./app/build/outputs/apk/debug/app-x86_64-debug.apk
        if-no-files-found: error
        retention-days: 30
    - name: Upload x86 APK
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary-x86
        path: ./app/build/outputs/apk/debug/app-x86-debug.apk
        if-no-files-found: error
        retention-days: 30
    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary-universal
        path: ./app/build/outputs/apk/debug/app-universal-debug.apk
        if-no-files-found: error
        retention-days: 30
