import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import com.android.build.OutputFile

plugins {
    id "com.android.application"
    id "androidx.navigation.safeargs.kotlin"
    id "kotlin-parcelize"
    id "dagger.hilt.android.plugin"
    id "com.google.devtools.ksp"
}

android {
    // Auxio implicitly depends on the native modules, explicitly specify it
    // here so the libraries are still stripped.
    ndkVersion ndk_version
    namespace "org.oxycblt.auxio"

    defaultConfig {
        applicationId namespace
        versionName "4.1.5"
        versionCode 75

        minSdk min_sdk
        // randomly flickers between deprecated and required depending on what mood my gradle is in
        // keep it for safety
        compileSdk target_sdk
        targetSdk target_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            dependenciesInfo {
                includeInApk = false
                includeInBundle = false
            }
        }
    }

    packagingOptions {
        jniLibs {
            excludes += ['**/kotlin/**', '**/okhttp3/**']
        }
        resources {
            excludes += ['DebugProbesKt.bin', 'kotlin-tooling-metadata.json', '**/kotlin/**', '**/okhttp3/**', 'META-INF/*.version']
        }
    }

    // Per-ABI APK splits — produces one APK per ABI instead of a single fat APK.
    // arm64-v8a     : 64-bit ARM (modern phones, ~99% of devices)
    // armeabi-v7a   : 32-bit ARM (legacy phones)
    // x86_64        : emulators / Intel tablets
    // x86           : legacy emulators (mostly obsolete but kept for compat)
    // universalApk  : fallback APK containing all ABIs (for unexpected CPU types)
    //
    // Each per-ABI APK is substantially smaller than the universal APK because
    // native libraries (.so) for the other 3 ABIs are excluded.
    //
    // Note: AGP 9.0 removed *density* splits, but ABI splits are still supported.
    // See: https://developer.android.com/build/configure-apk-splits
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

// Per-ABI versionCode mapping — assigns a unique, monotonic versionCode per ABI so
// the same versionName (e.g. 4.1.5) produces distinct versionCodes per APK.
// The universal APK is intentionally NOT overridden — it retains the base
// versionCode (75), which is the LOWEST, so that (if ever uploaded to Play Store)
// Play Store prefers per-ABI APKs and only falls back to the universal APK for
// unsupported CPU types.
//
// Formula: finalVersionCode = abiCode * 1000 + baseVersionCode
//   arm64-v8a     → 1 * 1000 + 75 = 1075
//   armeabi-v7a   → 2 * 1000 + 75 = 2075
//   x86           → 3 * 1000 + 75 = 3075
//   x86_64        → 4 * 1000 + 75 = 4075
//   universal     → 75  (default, NOT overridden — lowest, Play Store fallback)
//
// NOTE on API choice: AGP 9.0 removed the legacy variant API only when newDsl=true.
// The project does NOT set android.newDsl=false, but the runtime extension is
// `ApplicationAndroidComponentsExtensionImplCompat` (Compat shim), which exposes
// `android.applicationVariants` for backward compatibility with Groovy DSL build
// scripts. The modern `androidComponents.onVariants { ... }` form is Kotlin-DSL
// only — in Groovy it fails with "Could not find method onVariants() for arguments
// [closure]" because Gradle 9 removed implicit Closure→Action coercion. Hence we
// use the legacy Groovy DSL pattern shown in the official docs.
//
// Reference: https://developer.android.com/build/configure-apk-splits
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        // output.getFilter(OutputFile.ABI) returns the ABI name for per-ABI outputs,
        // or null for the universal APK (which we want to leave at default versionCode).
        def abi = output.getFilter(OutputFile.ABI)
        if (abi != null) {
            def abiCodes = ['arm64-v8a': 1, 'armeabi-v7a': 2, 'x86': 3, 'x86_64': 4]
            def baseAbiCode = abiCodes[abi]
            if (baseAbiCode != null) {
                output.versionCodeOverride = baseAbiCode * 1000 + variant.versionCode
            }
        }
        // Universal APK: abi is null → no override → retains default versionCode (75, lowest)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
        freeCompilerArgs.add("-jvm-default=enable")
        freeCompilerArgs.add("-Xannotation-default-target=param-property")
    }
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:$kotlin_coroutines_version"

    // --- SUPPORT ---

    // General
    implementation "androidx.core:core-ktx:$core_version"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.13.0"
    // good news: androidx-fragment 1.8.9's predictive back no longer crashes when you navigate
    // back across nested views too fast
    // bad news: it still doesn't cope well with home's inflation latency and freezes up
    // if you navigate twice very fast and time it right
    // keep it pinned down to pre-predictive back for now...
    // noinspection GradleDependency
    implementation "androidx.fragment:fragment-ktx:1.6.2"

    // Components
    // Deliberately kept on 1.2.1 to prevent a bug where the queue sheet will not collapse on
    // certain upwards scrolling events
    // TODO: Report this issue and hope for a timely fix
    // noinspection GradleDependency
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    // 1.1.0 upgrades recyclerview to 1.3.0, keep it on 1.0.0
    //noinspection GradleDependency
    implementation "androidx.viewpager2:viewpager2:1.0.0"

    // Lifecycle
    def lifecycle_version = "2.10.0"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // Navigation
    implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"

    // Media
    implementation "androidx.media:media:1.8.0"

    // Android Auto
    implementation "androidx.car.app:app:1.7.0"

    // Preferences
    implementation "androidx.preference:preference-ktx:1.2.1"

    // Database
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Build
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desugaring_version"

    // --- SECOND PARTY ---

    // Musikr
    implementation project(":musikr")

    // --- THIRD PARTY ---

    // Exoplayer (Vendored)
    implementation project(":media-lib-exoplayer")
    implementation project(":media-lib-decoder-ffmpeg")

    // decent-player USB Audio DAC (bit-perfect)
    implementation project(":decent-usb-audio-wrapper-media3")
    implementation project(":decent-media3-decoder-flac")

    // Image loading
    implementation 'io.coil-kt.coil3:coil-core:3.4.0'

    // Material
    // TODO: Exactly figure out the conditions that the 1.7.0 ripple bug occurred so you can just
    //  PR a fix.
    implementation "com.google.android.material:material:1.14.0-alpha10"

    // Dependency Injection
    implementation "com.google.dagger:dagger:$hilt_version"
    ksp "com.google.dagger:dagger-compiler:$hilt_version"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Speed dial
    implementation "com.leinardi.android:speed-dial:3.3.0"

    // Tasker integration
    implementation 'com.joaomgcd:taskerpluginlibrary:0.4.10'

    // Fuzzy search
    implementation 'org.apache.commons:commons-text:1.15.0'
}
