plugins {
    id "com.android.library"
}

android {
    namespace "com.decent.usbaudio.media3"
    compileSdk target_sdk

    defaultConfig {
        minSdk 29
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

}

dependencies {
    api project(":decent-usb-audio-driver")
    implementation "androidx.core:core-ktx:$core_version"

    // Use Auxio's vendored Media3 instead of Maven artifacts
    implementation project(":media-lib-exoplayer")
    implementation project(":media-lib-datasource")
    implementation project(":media-lib-database")

    // JSch fork (maintained) — SFTP streaming with native offset seek
    implementation "com.github.mwiede:jsch:0.2.23"
}
